<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech to Text</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e9ef;--mut:#8b93a7;--acc:#5b8cff;--red:#ff5b6e}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}
  .sp{flex:1}
  button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:9px 16px;border-radius:8px;cursor:pointer}
  button:hover{border-color:#394152}
  button.rec{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  button.rec.on{background:var(--red);border-color:var(--red)}
  button:disabled{opacity:.45;cursor:not-allowed}
  select{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:9px 12px;border-radius:8px}
  main{padding:24px;max-width:1020px;margin:0 auto}
  .live{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;min-height:104px;margin-bottom:24px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin-bottom:10px}
  .partial{font-size:19px;line-height:1.5;min-height:29px}
  .partial:empty::after{content:"Press Record and speak — Hindi, English, or a mix of both.";color:var(--mut);font-size:15px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:middle;opacity:.3}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
  .dot.on{animation:pulse 1.1s infinite;opacity:1}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:500;padding:0 10px 10px}
  td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:top}
  td.txt{width:100%}
  .meta{color:var(--mut);font-size:12px;white-space:nowrap}
  .tag{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:5px;font-size:11px;color:var(--mut)}
  .act button{padding:5px 10px;font-size:12px;margin-left:6px}
  .empty{color:var(--mut);text-align:center;padding:32px}
  [contenteditable]{outline:none;border-radius:5px;padding:2px 4px}
  [contenteditable]:focus{box-shadow:0 0 0 2px var(--acc)}
  #agent{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
  #agentOut{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px;white-space:pre-wrap;color:var(--mut)}
  #agentOut:empty{display:none}

  /* ── Agent widget ───────────────────────────────────────────────────── */
  #fab{position:fixed;right:24px;bottom:24px;width:52px;height:52px;border-radius:50%;
       display:grid;place-items:center;background:var(--acc);border:none;color:#fff;
       font-size:20px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:60;transition:transform .18s}
  #fab:hover{transform:scale(1.06)}
  #fab.hidden{display:none}
  #widget{position:fixed;right:24px;bottom:24px;width:390px;max-width:calc(100vw - 32px);
          height:560px;max-height:calc(100vh - 48px);background:var(--panel);
          border:1px solid var(--line);border-radius:14px;display:none;flex-direction:column;
          box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:61;overflow:hidden}
  #widget.open{display:flex}
  #widget.min{height:52px}
  #widget.min .wbody,#widget.min .wfoot{display:none}
  .whead{display:flex;align-items:center;gap:8px;padding:14px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .whead .t{font-size:13px;font-weight:600;letter-spacing:-.01em}
  .whead .sp{flex:1}
  .icon{background:none;border:none;color:var(--mut);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:14px;line-height:1}
  .icon:hover{background:#20242e;color:var(--fg)}
  .wbody{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:16px}
  .msg.u{align-self:flex-end;max-width:85%;background:var(--acc);color:#fff;padding:9px 13px;border-radius:14px 14px 4px 14px;font-size:14px}
  .msg.a{align-self:stretch;font-size:14px;line-height:1.6;white-space:pre-wrap}
  .thought{font-size:11px;color:var(--mut);margin-bottom:7px}
  .arow{display:flex;gap:2px;margin-top:8px}
  .arow button{background:none;border:none;color:var(--mut);cursor:pointer;padding:4px 6px;border-radius:5px;font-size:12px}
  .arow button:hover{background:#20242e;color:var(--fg)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:#1d212a;border:1px solid var(--line);color:var(--fg);padding:7px 12px;
        border-radius:999px;font-size:12.5px;cursor:pointer}
  .chip:hover{border-color:var(--acc)}
  .wfoot{flex:0 0 auto;border-top:1px solid var(--line);padding:11px 12px}
  .inrow{display:flex;align-items:flex-end;gap:8px;background:#1d212a;border:1px solid var(--line);
         border-radius:10px;padding:8px 10px}
  .inrow:focus-within{border-color:var(--acc)}
  #ain{flex:1;background:none;border:none;color:var(--fg);font:inherit;font-size:14px;resize:none;
       outline:none;max-height:96px;line-height:1.45}
  #asend{background:var(--acc);border:none;color:#fff;width:29px;height:29px;border-radius:7px;
         cursor:pointer;font-size:14px;flex:0 0 auto}
  #asend:disabled{opacity:.35;cursor:not-allowed}
  .disc{font-size:10.5px;color:var(--mut);text-align:center;margin-top:8px}
  .off{color:var(--mut);font-size:13px;line-height:1.6}
  .off code{background:#1d212a;padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Real-time Multilingual Speech to Text</h1>
  <span class="tag" id="stat">idle</span>
  <span class="sp"></span>
  <select id="lang" title="Whisper needs an explicit language; Hindi mode keeps Hinglish code-mixing intact">
    <option value="hi" selected>Hindi / Hinglish</option>
    <option value="en">English</option>
    <option value="bn">Bengali</option>
    <option value="ta">Tamil</option>
    <option value="te">Telugu</option>
    <option value="mr">Marathi</option>
    <option value="gu">Gujarati</option>
    <option value="ur">Urdu</option>
    <option value="es">Spanish</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="zh">Chinese</option>
    <option value="ja">Japanese</option>
    <option value="ar">Arabic</option>
  </select>
  <button id="rec" class="rec">● Record</button>
  <button id="refresh">Refresh</button>
</header>

<main>
  <div class="live">
    <div class="lbl"><span class="dot" id="dot"></span>Live transcript</div>
    <div class="partial" id="partial"></div>
  </div>

  <div class="lbl">Transcription history</div>
  <table>
    <thead><tr><th>Text</th><th>Lang</th><th>Dur</th><th>When</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty">No transcriptions yet.</div>

</main>

<button id="fab" title="Ask the transcript agent">✦</button>

<section id="widget" aria-label="Transcript agent">
  <div class="whead">
    <span class="t">Transcript agent</span>
    <span class="sp"></span>
    <button class="icon" id="wmin" title="Minimise">—</button>
    <button class="icon" id="wclose" title="Close">✕</button>
  </div>
  <div class="wbody" id="wbody"></div>
  <div class="wfoot" id="wfoot">
    <div class="inrow">
      <textarea id="ain" rows="1" placeholder="Ask about your transcripts…"></textarea>
      <button id="asend" title="Send">↑</button>
    </div>
    <div class="disc">Whisper and the agent can both make mistakes. Check the transcript.</div>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
let ws, ctx, node, stream, recording = false, sessionId = null;
const setStat = t => $('stat').textContent = t;
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load() {
  const items = await (await fetch('/api/transcriptions')).json();
  $('empty').style.display = items.length ? 'none' : 'block';
  $('rows').innerHTML = items.map(i => `<tr data-id="${i.id}">
    <td class="txt"><div contenteditable data-field="text">${esc(i.text)}</div></td>
    <td><span class="tag">${esc(i.language) || '?'}</span></td>
    <td class="meta">${(i.durationS ?? 0).toFixed(1)}s</td>
    <td class="meta">${i.createdAt ? new Date(i.createdAt).toLocaleTimeString() : ''}</td>
    <td class="act"><button data-act="save">Save</button><button data-act="del">Delete</button></td>
  </tr>`).join('');
  if (!sessionId && items.length) sessionId = items[0].sessionId;
}

$('rows').addEventListener('click', async e => {
  const btn = e.target.closest('button'); if (!btn) return;
  const tr = btn.closest('tr'), id = tr.dataset.id;
  if (btn.dataset.act === 'del') {
    await fetch(`/api/transcriptions/${id}`, {method:'DELETE'});
  } else {
    const text = tr.querySelector('[data-field="text"]').innerText.trim();
    if (!text) return;
    await fetch(`/api/transcriptions/${id}`, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})
    });
  }
  load();
});
$('refresh').onclick = load;

// Browsers capture at 44.1/48kHz; Whisper wants 16kHz mono.
function toPCM16(f32, inRate) {
  const ratio = inRate / 16000;
  const out = new Int16Array(Math.floor(f32.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const s = Math.max(-1, Math.min(1, f32[Math.floor(i * ratio)]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out.buffer;
}

async function start() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: {channelCount:1, echoCancellation:true, noiseSuppression:true}
  });
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/transcribe`);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'session') { sessionId = m.sessionId; setStat(m.modelReady ? 'listening' : 'loading model…'); }
    if (m.type === 'partial') $('partial').textContent = m.text;
    if (m.type === 'final') { $('partial').textContent = ''; load(); }
  };
  ws.onclose = () => { if (recording) stop(); };
  await new Promise(r => ws.onopen = r);
  ws.send(JSON.stringify({type:'config', language: $('lang').value}));

  ctx = new AudioContext();
  node = ctx.createScriptProcessor(4096, 1, 1);
  node.onaudioprocess = e => {
    if (ws.readyState === 1) ws.send(toPCM16(e.inputBuffer.getChannelData(0), ctx.sampleRate));
  };
  ctx.createMediaStreamSource(stream).connect(node);
  node.connect(ctx.destination);

  recording = true;
  $('rec').classList.add('on'); $('rec').textContent = '■ Stop';
  $('dot').classList.add('on'); setStat('listening');
}

function stop() {
  recording = false;
  try { ws.send('flush'); } catch {}
  node?.disconnect(); ctx?.close(); stream?.getTracks().forEach(t => t.stop());
  setTimeout(() => { try { ws.close(); } catch {} load(); }, 1200);
  $('rec').classList.remove('on'); $('rec').textContent = '● Record';
  $('dot').classList.remove('on'); setStat('idle');
}

$('lang').onchange = () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'config', language: $('lang').value}));
};
$('rec').onclick = () => recording ? stop() : start().catch(e => { setStat('mic blocked'); console.error(e); });


/* ── Agent widget ─────────────────────────────────────────────────────────
   Patterns borrowed from Linear (docked panel, plain-text responses),
   HoneyBook (per-response actions + disclaimer) and Apollo ("Thought for Ns").
   ---------------------------------------------------------------------- */
let agentEnabled = false, sending = false;

const QUICK = [
  ['Clean up',  s => `Fetch the transcript for session ${s} and return it cleaned up: fix punctuation and obvious mis-hearings only. Preserve the original language mix and script exactly.`],
  ['Summarize', s => `Fetch the transcript for session ${s} and summarise it in 3 bullets, in the same language mix the speaker used.`],
  ['Key points',s => `Fetch the transcript for session ${s} and list any decisions, dates or action items mentioned.`],
];

function bubble(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + (role === 'user' ? 'u' : 'a');
  el.textContent = text;
  $('wbody').appendChild(el);
  $('wbody').scrollTop = $('wbody').scrollHeight;
  return el;
}

function chips() {
  const wrap = document.createElement('div');
  wrap.className = 'chips';
  QUICK.forEach(([label, build]) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = label;
    b.onclick = () => {
      if (!sessionId) return bubble('agent', 'Record something first — there is no session to work with yet.');
      ask(build(sessionId), label);
    };
    wrap.appendChild(b);
  });
  $('wbody').appendChild(wrap);
}

function greet() {
  $('wbody').innerHTML = '';
  if (!agentEnabled) {
    const off = document.createElement('div');
    off.className = 'off';
    off.innerHTML = 'The agent is not configured.<br><br>Set <code>GOOGLE_GENERATIVE_AI_API_KEY</code> and restart the server to enable it. Speech-to-text works regardless.';
    $('wbody').appendChild(off);
    $('wfoot').style.display = 'none';
    return;
  }
  bubble('agent', 'I can work over your transcripts — clean them up, summarise them, or answer questions. I never translate: if you spoke Hinglish, it stays Hinglish.');
  chips();
}

async function ask(prompt, label) {
  if (sending || !agentEnabled) return;
  sending = true; $('asend').disabled = true;
  bubble('user', label || prompt);

  const holder = document.createElement('div');
  holder.className = 'msg a';
  const thought = document.createElement('div');
  thought.className = 'thought';
  thought.textContent = 'Thinking…';
  const body = document.createElement('div');
  holder.append(thought, body);
  $('wbody').appendChild(holder);
  $('wbody').scrollTop = $('wbody').scrollHeight;

  const t0 = Date.now();
  try {
    const r = await fetch('/api/agent/ask', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({prompt})
    });
    const j = await r.json();
    const secs = ((Date.now() - t0) / 1000).toFixed(1);
    thought.textContent = r.ok ? `Thought for ${secs}s` : 'Failed';
    body.textContent = j.answer ?? j.message ?? 'No response.';

    if (r.ok) {
      const row = document.createElement('div');
      row.className = 'arow';
      const copy = document.createElement('button');
      copy.textContent = '⧉ Copy';
      copy.onclick = () => { navigator.clipboard.writeText(body.textContent); copy.textContent = '✓ Copied'; setTimeout(() => copy.textContent = '⧉ Copy', 1400); };
      const again = document.createElement('button');
      again.textContent = '↻ Retry';
      again.onclick = () => ask(prompt, label);
      row.append(copy, again);
      holder.appendChild(row);
    }
  } catch (e) {
    thought.textContent = 'Failed';
    body.textContent = e.message;
  } finally {
    sending = false; $('asend').disabled = false;
    $('wbody').scrollTop = $('wbody').scrollHeight;
  }
}

$('fab').onclick = () => {
  $('widget').classList.add('open'); $('widget').classList.remove('min');
  $('fab').classList.add('hidden');
  if (!$('wbody').childElementCount) greet();
  $('ain').focus();
};
$('wclose').onclick = () => { $('widget').classList.remove('open'); $('fab').classList.remove('hidden'); };
$('wmin').onclick = () => $('widget').classList.toggle('min');

$('ain').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 96) + 'px';
});
$('ain').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('asend').click(); }
});
$('asend').onclick = () => {
  const v = $('ain').value.trim();
  if (!v) return;
  $('ain').value = ''; $('ain').style.height = 'auto';
  ask(v);
};

fetch('/api/agent/status').then(r => r.json()).then(s => { agentEnabled = s.enabled; });
load();
</script>
</body>
</html>
