<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech to Text</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#12151c; --panel2:#171b24; --line:#232936;
    --fg:#e8ebf2; --mut:#8b93a7; --dim:#5d6577;
    --acc:#5b8cff; --acc2:#7aa2ff; --red:#ff5b6e; --grn:#3ecf8e;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
       -webkit-font-smoothing:antialiased}

  /* ── top bar ─────────────────────────────────────────────────────────── */
  header{display:flex;align-items:center;gap:12px;padding:16px 22px;
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
         background:rgba(11,13,18,.85);backdrop-filter:blur(12px)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.015em}
  .brand svg{width:19px;height:19px;color:var(--acc)}
  .sp{flex:1}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);
        border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--fg)}
  .chip select{background:none;border:none;color:inherit;font:inherit;outline:none;cursor:pointer}
  .chip select option{background:var(--panel2)}
  .ghost{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
         border-radius:9px;padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer}
  .ghost:hover{border-color:#333c4e}
  .ghost:disabled{opacity:.4;cursor:not-allowed}

  main{max-width:940px;margin:0 auto;padding:28px 22px 80px}

  /* ── recorder card ───────────────────────────────────────────────────── */
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
         overflow:hidden;margin-bottom:30px}
  .wave{height:62px;display:block;width:100%;background:var(--panel2)}
  .stage-body{padding:24px 24px 20px}
  .status{display:flex;align-items:center;gap:9px;font-size:11.5px;text-transform:uppercase;
          letter-spacing:.1em;color:var(--mut);margin-bottom:14px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .dot.live{background:var(--red);animation:pulse 1.2s infinite}
  .dot.speech{background:var(--grn);animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .meter{display:inline-block;width:74px;height:5px;border-radius:3px;background:var(--line);
         overflow:hidden;margin-left:4px}
  .meter i{display:block;height:100%;width:0%;background:var(--grn);transition:width .08s linear}
  .meter i.hot{background:var(--acc)}
  .timer{margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--dim)}
  .live-text{font-size:20px;line-height:1.6;min-height:64px;font-weight:400}
  .live-text .ph{color:var(--dim);font-size:15px}
  .live-text .settled{color:var(--fg)}
  .live-text .draft{color:var(--mut);opacity:.75}
  .controls{display:flex;align-items:center;gap:12px;margin-top:22px;
            padding-top:18px;border-top:1px solid var(--line)}
  .rec{display:inline-flex;align-items:center;gap:9px;background:var(--acc);border:none;
       color:#fff;font:inherit;font-weight:600;font-size:14.5px;padding:11px 22px;
       border-radius:999px;cursor:pointer;transition:transform .12s,background .12s}
  .rec:hover{transform:translateY(-1px)}
  .rec.on{background:var(--red)}
  .rec .ico{width:10px;height:10px;border-radius:50%;background:#fff}
  .rec.on .ico{border-radius:2px}

  /* ── history ─────────────────────────────────────────────────────────── */
  .sec{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);
          font-weight:500;margin:0}
  .count{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
         padding:1px 7px;font-size:11px;color:var(--mut)}
  .row{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
  .row-main{flex:1;min-width:0}
  .row-text{font-size:15.5px;line-height:1.6;outline:none;border-radius:6px;padding:3px 5px;margin:-3px -5px}
  .row-text:focus{box-shadow:0 0 0 2px var(--acc)}
  .row-main audio{width:100%;max-width:420px;height:32px;margin-top:10px;display:block}
  .row-meta{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--dim)}
  .row-acts{display:flex;align-items:flex-start;gap:4px;flex-shrink:0}
  .ibtn{background:none;border:1px solid transparent;color:var(--mut);cursor:pointer;
        border-radius:8px;padding:7px 9px;font-size:13px;line-height:1;transition:.12s}
  .ibtn:hover{background:var(--panel2);border-color:var(--line);color:var(--fg)}
  .ibtn.play.on{color:var(--grn);background:var(--panel2);border-color:var(--line)}
  .ibtn.danger:hover{color:var(--red)}
  .empty{text-align:center;color:var(--dim);padding:44px 0;font-size:14px}

  /* ── voice / tone panel ──────────────────────────────────────────────── */
  .voice{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
         padding:18px 20px;margin-top:26px}
  .voice.hidden{display:none}
  .vhead{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .vhead h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);
            font-weight:500;margin:0}
  .vhead .caret{margin-left:auto;color:var(--dim);transition:transform .18s}
  .voice.open .caret{transform:rotate(180deg)}
  .vbody{display:none;gap:18px;margin-top:18px;flex-wrap:wrap}
  .voice.open .vbody{display:flex}
  .field{display:flex;flex-direction:column;gap:7px;min-width:180px;flex:1}
  .field label{font-size:11.5px;color:var(--mut);display:flex;justify-content:space-between}
  .field select,.field input[type=range]{width:100%}
  .field select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
                border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;outline:none}
  input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:var(--line);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:var(--acc);cursor:pointer;border:2px solid var(--panel)}
  .vnote{width:100%;font-size:11.5px;color:var(--dim);margin-top:4px}

  /* ── agent widget ────────────────────────────────────────────────────── */
  #fab{position:fixed;right:24px;bottom:24px;width:50px;height:50px;border-radius:50%;
       display:grid;place-items:center;background:var(--acc);border:none;color:#fff;
       font-size:19px;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:pointer;z-index:60}
  #fab.hidden{display:none}
  #widget{position:fixed;right:24px;bottom:24px;width:390px;max-width:calc(100vw - 32px);
          height:540px;max-height:calc(100vh - 48px);background:var(--panel);
          border:1px solid var(--line);border-radius:var(--r);display:none;flex-direction:column;
          box-shadow:0 22px 55px rgba(0,0,0,.6);z-index:61;overflow:hidden}
  #widget.open{display:flex}
  .whead{display:flex;align-items:center;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
  .whead .t{font-size:13px;font-weight:600}
  .wbody{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:15px}
  .msg.u{align-self:flex-end;max-width:85%;background:var(--acc);color:#fff;padding:9px 13px;
         border-radius:14px 14px 4px 14px;font-size:14px}
  .msg.a{align-self:stretch;font-size:14px;line-height:1.6;white-space:pre-wrap}
  .thought{font-size:11px;color:var(--dim);margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .qchip{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:7px 12px;
         border-radius:999px;font-size:12.5px;cursor:pointer}
  .qchip:hover{border-color:var(--acc)}
  .wfoot{border-top:1px solid var(--line);padding:11px 12px}
  .inrow{display:flex;align-items:flex-end;gap:8px;background:var(--panel2);
         border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .inrow:focus-within{border-color:var(--acc)}
  #ain{flex:1;background:none;border:none;color:var(--fg);font:inherit;font-size:14px;
       resize:none;outline:none;max-height:96px}
  #asend{background:var(--acc);border:none;color:#fff;width:28px;height:28px;border-radius:7px;cursor:pointer}
  .disc{font-size:10.5px;color:var(--dim);text-align:center;margin-top:8px}
  .off{color:var(--mut);font-size:13px;line-height:1.6}
  .off code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
  .arow{display:flex;gap:2px;margin-top:8px}
  .arow button{background:none;border:none;color:var(--mut);cursor:pointer;padding:4px 6px;
               border-radius:5px;font-size:12px}
  .arow button:hover{background:var(--panel2);color:var(--fg)}

  .tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--line)}
  .tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--mut);
       font:inherit;font-size:14px;padding:10px 16px;cursor:pointer;margin-bottom:-1px}
  .tab:hover{color:var(--fg)}
  .tab.active{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
  .panel[hidden]{display:none}
  #ttsText{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
           border-radius:10px;padding:14px;font:inherit;font-size:15px;resize:vertical;outline:none}
  #ttsText:focus{border-color:var(--acc)}
  .clip{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
  .clip audio{width:100%;height:34px}
  .clip .clip-text{font-size:15px;line-height:1.6}
  .clip .clip-meta{font-size:11.5px;color:var(--dim);display:flex;gap:14px}

  .examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .ex{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:999px;
      padding:7px 13px;font-size:12.5px;cursor:pointer;transition:.12s}
  .ex:hover{border-color:var(--acc);color:var(--fg)}
  .hint{font-size:12.5px;color:var(--dim)}
  #sttLang{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
           border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;outline:none}
  .ex .tag{display:inline-block;margin-right:7px;padding:1px 6px;border-radius:4px;
           background:var(--line);color:var(--mut);font-size:10.5px;text-transform:uppercase}
</style>
</head>
<body>

<header>
  <span class="brand">procucev</span>
</header>

<main>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="tts" role="tab">Text to Speech</button>
    <button class="tab" data-tab="stt" role="tab">Speech to Text</button>
  </nav>

  <section id="panel-stt" class="panel" hidden>
  <section class="stage">
    <canvas class="wave" id="wave"></canvas>
    <div class="stage-body">
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="stat">Idle</span>
        <span class="meter" title="Live microphone input level"><i id="meterFill"></i></span>
        <span class="timer" id="timer">0:00</span>
      </div>
      <div class="live-text" id="live"><span class="ph">Press Record and start speaking.</span></div>
      <div id="lastClip"></div>
      <div class="controls">
        <button class="rec" id="rec"><span class="ico"></span><span id="recLabel">Record</span></button>
        <select id="sttLang" title="Spoken language">
          <option value="en" selected>English</option>
          <option value="hi">Hindi / Hinglish</option>
          <option value="bn">Bengali</option>
          <option value="ta">Tamil</option>
          <option value="te">Telugu</option>
          <option value="mr">Marathi</option>
          <option value="gu">Gujarati</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ar">Arabic</option>
        </select>
        <button class="ghost" id="save" hidden>Save</button>
        <button class="ghost" id="discard" hidden>Discard</button>
        <span class="hint" id="hint">Audio is only sent while you're speaking.</span>
      </div>
    </div>
  </section>

  <div class="sec">
    <h2>Saved recordings</h2>
    <span class="count" id="count">0</span>
  </div>
  <div id="rows"></div>
  <div class="empty" id="empty">Nothing recorded yet.</div>
  </section>

  <section id="panel-tts" class="panel">
    <div class="stage">
      <div class="stage-body">
        <textarea id="ttsText" rows="4" placeholder="Write something to say…"></textarea>
        <div class="examples" id="ttsExamples"></div>
        <div class="controls">
          <button class="rec" id="ttsGo"><span class="ico"></span><span>Done</span></button>
          <span class="hint" id="ttsStat">Audio plays as each sentence is ready.</span>
        </div>
      </div>
    </div>
    <div class="sec"><h2>Generated audio</h2></div>
    <div id="ttsOut"></div>
    <div class="empty" id="ttsEmpty">Nothing generated yet.</div>
  </section>

  <section class="voice" id="voice">
    <div class="vhead" id="vhead">
      <h3>Playback voice &amp; tone</h3>
      <span class="caret">▾</span>
    </div>
    <div class="vbody">
      <div class="field">
        <label for="vsel">Voice</label>
        <select id="vsel"></select>
      </div>
      <div class="field">
        <label for="vrate">Speed <span id="vrateV">1.0×</span></label>
        <input type="range" id="vrate" min="0.5" max="2" step="0.1" value="1">
      </div>
      <div class="vnote" id="vnote"></div>
    </div>
  </section>
</main>


<script type="module" src="/app.js?v=__BUILD__"></script>
</body>
</html>
